# No game data is ever available here. Everything runs on the repository alone.
name: ci

on:
  push:
  pull_request:

jobs:
  build:
    name: build (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc
            cxx: g++
          - cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Install optional instruction-trace dependency
        run: python3 -m pip install --disable-pip-version-check capstone==5.0.9
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - name: Build
        run: cmake --build build -j
      - name: RT_SYSLIB unit tests (every push and pull request)
        run: ctest --test-dir build --output-on-failure --no-tests=error -R '^syslib$'
      - name: Remaining CTest suite
        run: ctest --test-dir build --output-on-failure --no-tests=error -E '^syslib$'
      - name: Differential harness and instruction-trace tests
        env:
          CC: ${{ matrix.cc }}
          BB_LOADER: build/runtime/libpbloader.so
        run: python3 -m unittest discover -s test -p 'test_harness.py'
      - name: Differential engine tests
        env:
          CC: ${{ matrix.cc }}
          BB_LOADER: build/runtime/libpbloader.so
        run: python3 -m unittest discover -s test -p 'test_differential.py'

  call-capture:
    # Generic call capture (runtime/call_capture.h): its capture-on battery (test_syslib's call
    # capture cases and test_plugin) at -O0 under AddressSanitizer and UndefinedBehaviorSanitizer,
    # and a build with the thunk compiled out.
    name: call capture (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc
            cxx: g++
            sanitize: -fsanitize=address,undefined
          - cc: clang
            cxx: clang++
            # -fsanitize=function reads a type signature just before every indirect call's target;
            # the generated stubs have none, so it faults on the first wrapped call.
            sanitize: -fsanitize=address,undefined -fno-sanitize=function
    steps:
      - uses: actions/checkout@v4
      - name: Configure with sanitizers (Debug, -O0)
        run: |
          flags="${{ matrix.sanitize }} -fno-sanitize-recover=all -fno-omit-frame-pointer"
          cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DCMAKE_C_FLAGS="$flags" -DCMAKE_CXX_FLAGS="$flags" \
            -DCMAKE_EXE_LINKER_FLAGS="$flags"
      - name: Build the capture tests
        run: cmake --build build-sanitize -j --target test_syslib test_plugin
      - name: Capture-on battery under ASan and UBSan
        run: ctest --test-dir build-sanitize --output-on-failure --no-tests=error -R '^(syslib|plugin)$'
      - name: Configure and build without call capture
        run: |
          cmake -S . -B build-off -DCMAKE_BUILD_TYPE=Release -DBB_ENABLE_CALL_CAPTURE=OFF \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          cmake --build build-off -j
      - name: Tests without call capture
        run: ctest --test-dir build-off --output-on-failure --no-tests=error -R '^(syslib|plugin)$'
      - name: No thunk code without call capture
        run: |
          if nm build-off/runtime/pbboot build-off/test_syslib build-off/test_plugin build-off/game/libbbgame.so |
              grep -E 'rt_call_capture_(thunk|enter|leave|returned)'; then
            echo "call capture code in a build without it" >&2
            exit 1
          fi

  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reject game data
        run: python3 tools/check_no_game_data.py --tracked
      - name: Validate functions.csv, ghidra_functions.csv, hooks.csv
        run: python3 tools/validate_functions.py
      - name: Game-agnostic runtime
        run: python3 tools/check_agnostic.py
      - name: Readable game code (STYLE.md); the allowlist only shrinks
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            git fetch --depth=1 origin "${{ github.base_ref }}"
            base=FETCH_HEAD
          else
            base="${{ github.event.before }}"
            git fetch --depth=1 origin "$base" 2>/dev/null || base=
          fi
          python3 tools/check_readable.py ${base:+--base "$base"}
      - name: README progress matches progress.py
        run: python3 tools/progress.py --check
      - name: Hooks behave
        run: tools/test_hooks.sh

  session-report:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate report and runtime-only path from changed files
        env:
          BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s' "$BODY" > "$RUNNER_TEMP/pr-body.md"
          python3 tools/runtime_pr.py --check-pull-request \
            --base "$BASE_SHA" --head "$HEAD_SHA" --body "$RUNNER_TEMP/pr-body.md"
